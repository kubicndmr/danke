program: spr.py
method: random
metric:
  goal: minimize
  name: avg_best_valid_loss
parameters:
  project_name:
    value: 'SPR'
  training_tag:
    value: 'wmf'
  trainset_path:
    value: 'Dataset/Train_SynPoCaP_WMF'
  validset_path:
    value: 'Dataset/Validation_PoCaP'
  testset_path:
    value: 'Dataset/Test'
  epochs:
    value: 1000
  num_ops:
    value: 20
  repeat_run:
    value: 5
  batch_size:
    values: [32, 64, 128, 256]
  model_dropout:
    values: [0, 0.1, 0.15, 0.2, 0.5]
  sentence_dropout:
    values: [0, 0.1, 0.15, 0.2, 0.5]
  learning_rate:
    values: [1e-6, 5e-6, 1e-5, 5e-5]
  weight_decay:
    values: [1e-7, 5e-7, 1e-6, 5e-6]
  model_dim:
    values: [128, 256, 512, 1024]
run_cap: 25